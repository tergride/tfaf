<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>TFAF</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #081016;
        user-select: none;
        -webkit-app-region: drag;
      }

      img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .bar {
        position: fixed;
        right: 22%;
        bottom: 6%;
        left: 22%;
        height: 3px;
        overflow: hidden;
        border-radius: 2px;
        background: rgb(255 255 255 / 8%);
      }

      .bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 35%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #f39a2b, transparent);
        animation: slide 1.2s ease-in-out infinite;
      }

      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(290%);
        }
      }
    </style>
  </head>
  <body>
    <img src="./src/assets/splash.jpg" alt="TFAF" />
    <div class="bar"></div>
  </body>
</html>
